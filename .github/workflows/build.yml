name: Build FlightWall

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release/**'
      - 'update/flightwall.uf2'
      - 'update/manifest.json'
      - 'update/manifest.sig'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FlightWall
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Check out Pico SDK 2.3.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.0
          submodules: recursive
          path: pico-sdk

      - name: Configure OTA build
        run: |
          cmake -S . -B build-ota -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLIGHTWALL_TBYB=ON

      - name: Build OTA image
        run: cmake --build build-ota --target hub75_demo

      - name: Configure USB recovery build
        run: |
          cmake -S . -B build-usb -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLIGHTWALL_TBYB=OFF

      - name: Build USB recovery image
        run: cmake --build build-usb --target hub75_demo

      - name: Upload OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightWall-OTA-UF2
          path: build-ota/hub75_demo.uf2
          if-no-files-found: error

      - name: Upload USB recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightWall-USB-UF2
          path: build-usb/hub75_demo.uf2
          if-no-files-found: error
