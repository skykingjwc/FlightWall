name: Build FlightWall

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FlightWall
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Check out Pico SDK 2.3.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.0
          submodules: recursive
          path: pico-sdk

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target hub75_demo

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: FlightWall-UF2
          path: build/hub75_demo.uf2
          if-no-files-found: error
