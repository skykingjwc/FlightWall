name: Build FlightWall

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release/**'
      - 'update/flightwall.uf2'
      - 'update/manifest.json'
      - 'update/manifest.sig'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FlightWall
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Check out Pico SDK 2.3.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.0
          submodules: recursive
          path: pico-sdk

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target hub75_demo

      - name: Prepare release binaries
        run: |
          mkdir -p release update
          cp build/hub75_demo.uf2 release/FlightWall-v1.6.1.uf2
          python3 - <<'PY'
          from pathlib import Path
          full = Path("build/hub75_demo.uf2").read_bytes()
          payload = bytearray(full[512:])
          payload.extend(b"\x00" * ((-len(payload)) % 2048))
          Path("update/flightwall.uf2").write_bytes(payload)
          PY

      - name: Publish release binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/FlightWall-v1.6.1.uf2 update/flightwall.uf2
          if git diff --cached --quiet; then
            echo "Release binaries already current"
          else
            git commit -m "Publish FlightWall v1.6.1 recovery binaries"
            git push
          fi

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightWall-UF2
          path: build/hub75_demo.uf2
          if-no-files-found: error
