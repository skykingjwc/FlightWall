name: Build FlightWall

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release/**'
      - 'update/flightwall.uf2'
      - 'update/manifest.json'
      - 'update/manifest.sig'
  workflow_dispatch:

concurrency:
  group: flightwall-main-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FlightWall
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.2.Rel1'

      - name: Check out Pico SDK 2.3.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.0
          submodules: recursive
          path: pico-sdk

      - name: Configure OTA build
        run: |
          cmake -S . -B build-ota -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLIGHTWALL_TBYB=ON

      - name: Build OTA image
        run: cmake --build build-ota --target hub75_demo

      - name: Configure USB recovery build
        run: |
          cmake -S . -B build-usb -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLIGHTWALL_TBYB=OFF

      - name: Build USB recovery image
        run: cmake --build build-usb --target hub75_demo

      - name: Read firmware version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*FLIGHTWALL_VERSION="\([0-9][0-9.]*\)".*/\1/p' CMakeLists.txt | head -n 1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Name build outputs
        shell: bash
        run: |
          cp build-ota/hub75_demo.uf2 "FlightWall-v${VERSION}-OTA.uf2"
          cp build-usb/hub75_demo.uf2 "FlightWall-v${VERSION}-USB.uf2"

      - name: Upload OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightWall-v${{ env.VERSION }}-OTA
          path: FlightWall-v${{ env.VERSION }}-OTA.uf2
          if-no-files-found: error

      - name: Upload USB recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightWall-v${{ env.VERSION }}-USB
          path: FlightWall-v${{ env.VERSION }}-USB.uf2
          if-no-files-found: error
