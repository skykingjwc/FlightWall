name: Publish FlightWall v1.6.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.6.4.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download verified OTA build
        uses: actions/download-artifact@v4
        with:
          name: FlightWall-v1.6.4-OTA
          path: ota
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40437119788

      - name: Download verified USB build
        uses: actions/download-artifact@v4
        with:
          name: FlightWall-v1.6.4-USB
          path: usb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40437119788

      - name: Prepare repository binaries
        run: |
          mkdir -p release update
          cp usb/hub75_demo.uf2 release/FlightWall-v1.6.4.uf2
          python3 - <<'PY'
          from pathlib import Path
          full=Path("ota/hub75_demo.uf2").read_bytes()
          payload=bytearray(full[512:])
          payload.extend(b"\x00"*((-len(payload))%2048))
          Path("update/flightwall.uf2").write_bytes(payload)
          PY

      - name: Publish binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/FlightWall-v1.6.4.uf2 update/flightwall.uf2
          if ! git diff --cached --quiet; then
            git commit -m "Publish FlightWall v1.6.4 binaries"
            git push
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.6.4 release/FlightWall-v1.6.4.uf2 \
            --repo "$GITHUB_REPOSITORY" \
            --target b67ed36528986b777dd95cb32e65eca002050c91 \
            --title "FlightWall v1.6.4" \
            --notes-file RELEASE-v1.6.4.md
