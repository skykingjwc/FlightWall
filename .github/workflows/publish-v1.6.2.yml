name: Publish v1.6.2 Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.6.2.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out FlightWall
        uses: actions/checkout@v4

      - name: Download verified USB recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: FlightWall-USB-UF2
          path: usb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40434581440

      - name: Download verified OTA artifact
        uses: actions/download-artifact@v4
        with:
          name: FlightWall-OTA-UF2
          path: ota
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40434581440

      - name: Prepare release binaries
        run: |
          mkdir -p release update
          cp usb/hub75_demo.uf2 release/FlightWall-v1.6.2.uf2
          python3 - <<'PY'
          from pathlib import Path
          full = Path("ota/hub75_demo.uf2").read_bytes()
          payload = bytearray(full[512:])
          payload.extend(b"\x00" * ((-len(payload)) % 2048))
          Path("update/flightwall.uf2").write_bytes(payload)
          PY

      - name: Publish release binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f release/FlightWall-v1.6.2.uf2 update/flightwall.uf2
          git commit -m "Publish FlightWall v1.6.2 recovery binaries"
          git push
