name: Build FlightWall v1.6.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v1.6.4.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.2.Rel1'
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.0
          submodules: recursive
          path: pico-sdk
      - name: Configure OTA
        run: cmake -S . -B build-ota -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DCMAKE_BUILD_TYPE=Release -DFLIGHTWALL_TBYB=ON
      - name: Build OTA
        run: cmake --build build-ota --target hub75_demo
      - name: Configure USB
        run: cmake -S . -B build-usb -G Ninja -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" -DCMAKE_BUILD_TYPE=Release -DFLIGHTWALL_TBYB=OFF
      - name: Build USB
        run: cmake --build build-usb --target hub75_demo
      - uses: actions/upload-artifact@v4
        with:
          name: FlightWall-v1.6.4-OTA
          path: build-ota/hub75_demo.uf2
      - uses: actions/upload-artifact@v4
        with:
          name: FlightWall-v1.6.4-USB
          path: build-usb/hub75_demo.uf2
