name: Stage FlightWall Update Payload

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: flightwall-update-stage
  cancel-in-progress: true

jobs:
  stage:
    if: startsWith(github.event.head_commit.message, 'Stage update payload')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.2.Rel1'

      - name: Check out Pico SDK 2.3.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.3.0
          submodules: recursive
          path: pico-sdk

      - name: Configure OTA build
        run: |
          cmake -S . -B build-ota -G Ninja \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFLIGHTWALL_TBYB=ON

      - name: Build OTA image
        run: cmake --build build-ota --target hub75_demo

      - name: Stage update payload and metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import re

          cmake = Path("CMakeLists.txt").read_text()
          version = re.search(r'FLIGHTWALL_VERSION="([^"]+)"', cmake).group(1)
          build = int(re.search(r'FLIGHTWALL_BUILD_NUMBER=([0-9]+)', cmake).group(1))

          full = Path("build-ota/hub75_demo.uf2").read_bytes()
          if len(full) < 1024 or len(full) % 512:
              raise SystemExit("invalid OTA UF2")
          payload = bytearray(full[512:])
          payload.extend(b"\x00" * ((-len(payload)) % 2048))

          sha256 = hashlib.sha256(payload).hexdigest()
          blob_sha = hashlib.sha1(
              f"blob {len(payload)}\0".encode() + payload
          ).hexdigest()

          update = Path("update")
          update.mkdir(exist_ok=True)
          (update / "flightwall.uf2").write_bytes(payload)

          chunk_dir = update / "chunks"
          if chunk_dir.exists():
              import shutil
              shutil.rmtree(chunk_dir)
          chunk_dir.mkdir()
          chunk_size = 32768
          chunk_shas = []
          for index, offset in enumerate(range(0, len(payload), chunk_size)):
              chunk = bytes(payload[offset:offset + chunk_size])
              chunk_path = chunk_dir / f"{index:03d}.bin"
              chunk_path.write_bytes(chunk)
              chunk_sha = hashlib.sha1(
                  f"blob {len(chunk)}\0".encode() + chunk
              ).hexdigest()
              chunk_shas.append(chunk_sha)

          metadata = {
              "blob_sha": blob_sha,
              "build": build,
              "chunk_size": chunk_size,
              "chunks": ",".join(chunk_shas),
              "schema": 4,
              "sha256": sha256,
              "size": len(payload),
              "version": version,
          }
          (update / "payload-info.json").write_text(
              json.dumps(metadata, sort_keys=True, indent=2) + "\n"
          )
          (update / "check.json").write_text(
              json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\n"
          )

          print(f"version={version}")
          print(f"build={build}")
          print(f"size={len(payload)}")
          print(f"sha256={sha256}")
          print(f"blob_sha={blob_sha}")

      - name: Commit staged payload
        shell: bash
        run: |
          git config user.name "FlightWall Update Stager"
          git config user.email "actions@users.noreply.github.com"
          git add -A update/flightwall.uf2 update/payload-info.json update/check.json update/chunks
          if git diff --cached --quiet; then
            echo "Payload already current"
            exit 0
          fi
          VERSION="$(python3 -c 'import json; print(json.load(open("update/payload-info.json"))["version"])')"
          git commit -m "Stage FlightWall update payload v${VERSION}"

          # Another generated-content workflow (for example airline assets)
          # may have updated main while this build was running. Rebase the
          # generated payload commit onto the current remote head before push.
          git pull --rebase origin main
          git push
